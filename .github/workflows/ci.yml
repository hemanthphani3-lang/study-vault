name: StudyVault Continuous Integration & Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  flutter-quality-gate:
    name: Flutter Mobile Application Audit & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Static Analysis
        run: flutter analyze

      - name: Run Flutter Unit & E2E Integration Tests
        run: flutter test --coverage

  backend-quality-gate:
    name: FastAPI Backend Services & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio httpx

      - name: Run Backend Pytest Suite
        working-directory: backend
        run: python -m pytest app/tests/ -v

  tracker-quality-gate:
    name: Global Academic Tracker Service Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Tracker Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/tracker/requirements.txt pytest pytest-asyncio httpx

      - name: Run Tracker Pytest Suite
        working-directory: services/tracker
        run: python -m pytest app/tests/ -v
