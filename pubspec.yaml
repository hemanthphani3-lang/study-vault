name: study_vault
description: "StudyVault - Knowledge Beyond Borders. Open Source Cross Platform Academic Knowledge Network."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^17.4.0

  # Local SQLite Persistence
  drift: ^2.18.0
  drift_flutter: ^0.1.0

  # Typography & Design System
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Icons & Utility
  intl: '>=0.19.0 <0.21.0'

  # HTTP Client (cross-platform: web + native)
  http: ^1.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

dependency_overrides:
  objective_c:
    path: stubs/objective_c

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
